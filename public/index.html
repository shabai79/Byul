<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Byul</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <a class="logo" href="#map">✦ Byul</a>
    <nav>
      <a href="#map" data-i18n="nav.map"></a>
      <a href="#trips" data-i18n="nav.trips"></a>
      <a href="#inbox" data-i18n="nav.inbox"></a>
      <select id="langSel" aria-label="Language"></select>
      <span id="userBox"></span>
    </nav>
  </header>

  <main>
    <!-- 지도 + 목록 -->
    <section id="view-map" class="view">
      <div class="toolbar">
        <input id="q" data-i18n-ph="search.ph" />
        <select id="cat"></select>
        <button id="newPostBtn" class="primary" data-i18n="btn.newPost"></button>
      </div>
      <div class="split">
        <div id="map"></div>
        <ul id="list" class="cards"></ul>
      </div>
    </section>

    <!-- 여행 일정 -->
    <section id="view-trips" class="view hidden">
      <h2 data-i18n="trips.title"></h2>
      <p class="muted" data-i18n="trips.desc"></p>
      <form id="tripForm" class="panel">
        <label><span data-i18n="trips.place"></span> <input name="placeName" required data-i18n-ph="trips.placePh" /></label>
        <div class="row">
          <label><span data-i18n="trips.start"></span> <input type="date" name="startDate" /></label>
          <label><span data-i18n="trips.end"></span> <input type="date" name="endDate" /></label>
          <label><span data-i18n="trips.radius"></span> <input type="number" name="radiusKm" value="30" min="1" max="500" /></label>
        </div>
        <div id="tripMap" class="minimap"></div>
        <p class="muted small" data-i18n="trips.pickHint"></p>
        <button class="primary" data-i18n="trips.submit"></button>
      </form>
      <div id="tripList"></div>
    </section>

    <!-- 메시지함 -->
    <section id="view-inbox" class="view hidden">
      <h2 data-i18n="inbox.title"></h2>
      <p class="muted small" data-i18n="inbox.notice"></p>
      <div class="inbox">
        <ul id="threadList" class="threads"></ul>
        <div id="chat" class="chat"><p class="muted" data-i18n="inbox.select"></p></div>
      </div>
    </section>
  </main>

  <dialog id="modal"><div id="modalBody"></div></dialog>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
