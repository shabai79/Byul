<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Byul</title>
  <meta name="theme-color" content="#f3eee4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Gowun+Batang:wght@400;700&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <a class="logo" href="#map">Byul</a>
    <nav>
      <a href="#map" data-i18n="nav.map"></a>
      <a href="#trips" data-i18n="nav.trips"></a>
      <a href="#inbox" data-i18n="nav.inbox"></a>
      <label class="lang" data-icon="globe"><select id="langSel" aria-label="Language"></select></label>
    </nav>
    <span id="userBox"></span>
  </header>

  <main>
    <!-- 지도 + 목록 -->
    <section id="view-map" class="view">
      <div class="hero">
        <div class="hero-text">
          <p class="kicker">Lost &amp; Found, anywhere</p>
          <h1 data-i18n="hero.title"></h1>
          <p class="lede" data-i18n="hero.sub"></p>
        </div>
      <ol class="how">
        <li><b data-i18n="how.1t"></b><span data-i18n="how.1d"></span></li>
        <li><b data-i18n="how.2t"></b><span data-i18n="how.2d"></span></li>
        <li><b data-i18n="how.3t"></b><span data-i18n="how.3d"></span></li>
      </ol>
      </div>
      <div class="toolbar">
        <label class="search" data-icon="search"><input id="q" type="search" data-i18n-ph="search.ph" /></label>
        <button id="newPostBtn" class="primary desktop-only" data-icon="plus"><span data-i18n="btn.newPost"></span></button>
      </div>
      <div id="chips" class="chips"></div>
      <div class="listbar">
        <span id="count" class="count"></span>
        <div class="listbar-right">
          <button id="nearBtn" class="ghost" data-icon="locate"><span data-i18n="btn.nearMe"></span></button>
          <select id="sort" aria-label="sort">
            <option value="new" data-i18n="sort.new"></option>
            <option value="reward" data-i18n="sort.reward"></option>
            <option value="near" data-i18n="sort.near"></option>
          </select>
        </div>
      </div>
      <div class="seg mobile-only" id="viewToggle">
        <button data-mode="list" class="on" data-icon="list"><span data-i18n="view.list"></span></button>
        <button data-mode="map" data-icon="map"><span data-i18n="view.map"></span></button>
      </div>
      <div class="split" id="split" data-mode="list">
        <div id="map"></div>
        <ul id="list" class="cards"></ul>
      </div>
      <button id="fab" class="fab mobile-only" data-icon="plus"><span data-i18n="btn.newPost"></span></button>
    </section>

    <!-- 여행 일정 -->
    <section id="view-trips" class="view hidden">
      <h2 data-i18n="trips.title"></h2>
      <p class="muted" data-i18n="trips.desc"></p>
      <form id="tripForm" class="panel">
        <label><span data-i18n="trips.place"></span> <input name="placeName" required data-i18n-ph="trips.placePh" /></label>
        <div class="row">
          <label><span data-i18n="trips.start"></span> <input type="date" name="startDate" /></label>
          <label><span data-i18n="trips.end"></span> <input type="date" name="endDate" /></label>
          <label><span data-i18n="trips.radius"></span> <input type="number" name="radiusKm" value="30" min="1" max="500" /></label>
        </div>
        <div id="tripMap" class="minimap"></div>
        <p class="muted small" data-i18n="trips.pickHint"></p>
        <button class="primary" data-i18n="trips.submit"></button>
      </form>
      <div id="tripList"></div>
    </section>

    <!-- 메시지함 -->
    <section id="view-inbox" class="view hidden">
      <h2 data-i18n="inbox.title"></h2>
      <p class="muted small" data-i18n="inbox.notice"></p>
      <div class="inbox">
        <ul id="threadList" class="threads"></ul>
        <div id="chat" class="chat"><p class="muted" data-i18n="inbox.select"></p></div>
      </div>
    </section>
  </main>

  <dialog id="modal"><div id="modalBody"></div></dialog>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/icons.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
